<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hugging Voice</title>
    <script
      src="https://cdn.jsdelivr.net/npm/livekit-client@2.20.2/dist/livekit-client.umd.min.js"
      integrity="sha384-qbqEcU5thA3okJYaeKhyVTz7XGlrhCR6DyHf3LBIWXzYuqfh6Rn0wCizDWh6zY0O"
      crossorigin="anonymous"
    ></script>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #0b0d12;
        color: #f4f7fb;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 10%, #23335f 0, transparent 34rem),
          radial-gradient(circle at 90% 90%, #143d34 0, transparent 30rem),
          #0b0d12;
      }
      main {
        width: min(820px, calc(100% - 28px));
        margin: 28px auto;
        padding: clamp(24px, 5vw, 48px);
        border: 1px solid #ffffff1f;
        border-radius: 28px;
        background: #11151de8;
        box-shadow: 0 30px 80px #0009;
        backdrop-filter: blur(18px);
      }
      h1 { margin: 0; font-size: clamp(2rem, 7vw, 4rem); letter-spacing: -0.06em; }
      .lede { color: #aeb8c8; margin: 10px 0 28px; }
      .orb-wrap { display: grid; place-items: center; min-height: 190px; }
      .orb {
        width: 132px;
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fff, #7cc8ff 18%, #7566ff 52%, #272044 72%);
        box-shadow: 0 0 70px #7067ff70;
        transition: filter 120ms ease;
        will-change: transform, box-shadow;
      }
      .orb.listening { filter: saturate(1.28) hue-rotate(-10deg); }
      .orb.speaking { filter: saturate(1.3) hue-rotate(24deg); }
      .status { text-align: center; color: #cbd4e2; min-height: 24px; }
      .warning { color: #ffc780; background: #3c2918; border-radius: 12px; padding: 12px; margin: 14px 0; }
      .hidden { display: none !important; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      label { display: grid; gap: 7px; color: #b8c2d2; font-size: 0.88rem; }
      label.wide { grid-column: 1 / -1; }
      select, input {
        width: 100%;
        border: 1px solid #ffffff20;
        border-radius: 12px;
        padding: 11px 12px;
        background: #090c12;
        color: inherit;
        font: inherit;
      }
      .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 22px; }
      button {
        border: 0;
        border-radius: 999px;
        padding: 12px 20px;
        background: #f4f7fb;
        color: #11151d;
        font-weight: 750;
        cursor: pointer;
      }
      button.secondary { background: #272d39; color: #f4f7fb; }
      button.danger { background: #4b2229; color: #ffdce1; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      .transcript { margin-top: 26px; display: grid; gap: 10px; max-height: 260px; overflow: auto; }
      .line { padding: 12px 14px; border-radius: 14px; background: #ffffff0c; }
      .line strong { display: block; color: #8fdac4; font-size: 0.78rem; margin-bottom: 3px; }
      .tools { margin-top: 26px; border-top: 1px solid #ffffff16; padding-top: 20px; }
      .tools-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
      .tools h2 { margin: 0; font-size: 1rem; }
      .tools-note { color: #7f8999; font-size: 0.78rem; }
      .tool-calls { display: grid; gap: 9px; margin-top: 12px; }
      .tool-empty { color: #7f8999; font-size: 0.88rem; padding: 4px 0; }
      .tool-call { display: grid; gap: 7px; padding: 12px 14px; border-radius: 14px; background: #090c12; border: 1px solid #ffffff12; }
      .tool-call-header { display: flex; justify-content: space-between; gap: 12px; }
      .tool-name { color: #a9bfff; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 0.85rem; }
      .tool-status { color: #ffc780; font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.04em; }
      .tool-call.completed .tool-status { color: #8fdac4; }
      .tool-call.failed .tool-status { color: #ff9ca9; }
      .tool-detail { margin: 0; color: #aeb8c8; font: 0.78rem/1.5 ui-monospace, SFMono-Regular, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
      footer { margin-top: 24px; color: #7f8999; font-size: 0.78rem; text-align: center; }
      #remote-audio { display: none; }
      @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Hugging Voice</h1>
      <p class="lede">A small LiveKit room connected to the local multilingual voice service.</p>
      <div id="secure-warning" class="warning hidden"></div>
      <div class="orb-wrap"><div id="orb" class="orb"></div></div>
      <div id="status" class="status">Ready to connect</div>

      <section id="options" class="grid">
        <label>Language
          <select id="language">
            <option value="">Service default</option>
            <option value="de">German</option><option value="en">English</option>
            <option value="fr">French</option><option value="it">Italian</option>
          </select>
        </label>
        <label>Voice
          <select id="voice">
            <option value="">Service default</option>
            <option value="thorsten">Thorsten (human recording, German)</option>
            <option value="warm_female">Warm female</option>
            <option value="clear_female">Clear female</option>
            <option value="warm_male">Warm male</option>
            <option value="clear_male">Clear male</option>
            <option value="friendly_neutral">Friendly neutral</option>
          </select>
        </label>
        <label class="wide">Speaking style (optional)
          <input id="voice-instructions" maxlength="2000" placeholder="Speak warmly and at a relaxed pace." />
        </label>
      </section>

      <div class="controls">
        <button id="connect">Start conversation</button>
        <button id="mute" class="secondary hidden">Mute microphone</button>
        <button id="resume" class="secondary hidden">Enable sound</button>
        <button id="disconnect" class="danger hidden">End</button>
      </div>
      <div id="transcript" class="transcript" aria-live="polite"></div>
      <section class="tools" aria-labelledby="tools-title">
        <div class="tools-heading">
          <h2 id="tools-title">Tool calls</h2>
          <span class="tools-note">add_numbers · count_characters</span>
        </div>
        <div id="tool-calls" class="tool-calls" aria-live="polite">
          <div id="tool-empty" class="tool-empty">No tool called yet.</div>
        </div>
      </section>
      <div id="remote-audio"></div>
      <footer>Microphone audio travels to the agent over LiveKit WebRTC.</footer>
    </main>

    <script>
      const { Room, RoomEvent, Track } = LivekitClient;
      const statusEl = document.querySelector('#status');
      const orb = document.querySelector('#orb');
      const connectButton = document.querySelector('#connect');
      const muteButton = document.querySelector('#mute');
      const resumeButton = document.querySelector('#resume');
      const disconnectButton = document.querySelector('#disconnect');
      const options = document.querySelector('#options');
      const transcript = document.querySelector('#transcript');
      const warning = document.querySelector('#secure-warning');
      const audioHost = document.querySelector('#remote-audio');
      const toolCallHost = document.querySelector('#tool-calls');
      const toolEmpty = document.querySelector('#tool-empty');
      let room;
      let muted = false;
      let audioContext;
      let inputMeter;
      let meterFrame;
      let visualLevel = 0;
      const outputMeters = new Map();
      const transcriptLines = new Map();
      const toolCallNodes = new Map();
      const toolEventTopic = 'hugging_voice.tool_call';
      const textDecoder = new TextDecoder();

      if (!window.isSecureContext && !['localhost', '127.0.0.1'].includes(location.hostname)) {
        warning.textContent = 'This page is not a secure browser context. Open it through HTTPS or an SSH localhost tunnel to enable microphone access.';
        warning.classList.remove('hidden');
      }

      function setStatus(text) { statusEl.textContent = text; }
      function showConnected(connected) {
        connectButton.classList.toggle('hidden', connected);
        muteButton.classList.toggle('hidden', !connected);
        disconnectButton.classList.toggle('hidden', !connected);
        options.classList.toggle('hidden', connected);
      }
      async function ensureAudioContext() {
        if (!audioContext) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) throw new Error('This browser does not support audio level metering.');
          audioContext = new AudioContext();
        }
        if (audioContext.state === 'suspended') await audioContext.resume();
        if (!meterFrame) meterFrame = requestAnimationFrame(updateOrbFromLevels);
      }
      function createLevelMeter(track) {
        const mediaTrack = track?.mediaStreamTrack;
        if (!audioContext || !mediaTrack) return null;
        const analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        const samples = new Uint8Array(analyser.fftSize);
        const source = audioContext.createMediaStreamSource(new MediaStream([mediaTrack]));
        source.connect(analyser);
        return { analyser, samples, source };
      }
      function releaseLevelMeter(meter) {
        if (!meter) return;
        meter.source.disconnect();
        meter.analyser.disconnect();
      }
      function measuredLevel(meter) {
        if (!meter) return 0;
        meter.analyser.getByteTimeDomainData(meter.samples);
        let sum = 0;
        for (const sample of meter.samples) {
          const centered = (sample - 128) / 128;
          sum += centered * centered;
        }
        const rms = Math.sqrt(sum / meter.samples.length);
        return Math.min(1, Math.max(0, (rms - 0.01) * 7));
      }
      function updateOrbFromLevels() {
        const inputLevel = muted ? 0 : measuredLevel(inputMeter);
        let outputLevel = 0;
        for (const meter of outputMeters.values()) {
          outputLevel = Math.max(outputLevel, measuredLevel(meter));
        }
        const target = Math.max(inputLevel, outputLevel);
        const blend = target > visualLevel ? 0.48 : 0.12;
        visualLevel += (target - visualLevel) * blend;
        if (visualLevel < 0.002) visualLevel = 0;

        const speaking = outputLevel > 0.015 && outputLevel >= inputLevel;
        const listening = inputLevel > 0.015 && !speaking;
        const color = speaking ? '88, 224, 185' : listening ? '124, 200, 255' : '112, 103, 255';
        const glow = 58 + visualLevel * 92;
        const halo = 95 + visualLevel * 135;
        const opacity = 0.34 + visualLevel * 0.5;
        orb.style.transform = `scale(${1 + visualLevel * 0.14})`;
        orb.style.boxShadow =
          `0 0 ${glow}px rgba(${color}, ${opacity}), 0 0 ${halo}px rgba(${color}, ${visualLevel * 0.2})`;
        orb.classList.toggle('listening', listening);
        orb.classList.toggle('speaking', speaking);
        meterFrame = requestAnimationFrame(updateOrbFromLevels);
      }
      function setInputMeter(track) {
        releaseLevelMeter(inputMeter);
        inputMeter = createLevelMeter(track);
      }
      function addOutputMeter(track) {
        const existing = outputMeters.get(track);
        if (existing) releaseLevelMeter(existing);
        const meter = createLevelMeter(track);
        if (meter) outputMeters.set(track, meter);
      }
      function removeOutputMeter(track) {
        releaseLevelMeter(outputMeters.get(track));
        outputMeters.delete(track);
      }
      async function stopLevelMeters() {
        if (meterFrame) cancelAnimationFrame(meterFrame);
        meterFrame = undefined;
        releaseLevelMeter(inputMeter);
        inputMeter = undefined;
        for (const meter of outputMeters.values()) releaseLevelMeter(meter);
        outputMeters.clear();
        visualLevel = 0;
        orb.className = 'orb';
        orb.style.transform = '';
        orb.style.boxShadow = '';
        const context = audioContext;
        audioContext = undefined;
        if (context && context.state !== 'closed') await context.close();
      }
      function upsertTranscript(id, speaker, text, final) {
        let line = transcriptLines.get(id);
        if (!line) {
          line = document.createElement('div');
          line.className = 'line';
          line.innerHTML = '<strong></strong><span></span>';
          transcript.prepend(line);
          transcriptLines.set(id, line);
        }
        line.querySelector('strong').textContent = speaker;
        line.querySelector('span').textContent = text + (final ? '' : ' …');
      }
      function isToolEvent(event) {
        return event?.version === 1 && typeof event.call_id === 'string' &&
          typeof event.name === 'string' && ['running', 'completed', 'failed'].includes(event.status) &&
          event.arguments && typeof event.arguments === 'object' && !Array.isArray(event.arguments) &&
          (event.result === undefined || typeof event.result === 'string');
      }
      function upsertToolCall(event) {
        let card = toolCallNodes.get(event.call_id);
        if (!card) {
          card = document.createElement('article');
          card.className = 'tool-call';
          const header = document.createElement('div');
          header.className = 'tool-call-header';
          const name = document.createElement('strong');
          name.className = 'tool-name';
          const status = document.createElement('span');
          status.className = 'tool-status';
          const detail = document.createElement('pre');
          detail.className = 'tool-detail';
          header.append(name, status);
          card.append(header, detail);
          toolCallHost.prepend(card);
          toolCallNodes.set(event.call_id, card);
          toolEmpty.classList.add('hidden');
        }
        card.className = `tool-call ${event.status}`;
        card.querySelector('.tool-name').textContent = event.name;
        card.querySelector('.tool-status').textContent = event.status;
        const detail = `arguments: ${JSON.stringify(event.arguments)}` +
          (event.result === undefined ? '' : `\nresult: ${event.result}`);
        card.querySelector('.tool-detail').textContent = detail;
      }

      function configureRoom() {
        room = new Room({ adaptiveStream: true, dynacast: true });
        room.registerTextStreamHandler('lk.transcription', async (reader, participantInfo) => {
          let text = '';
          const initialAttrs = reader.info.attributes || {};
          const id = initialAttrs['lk.segment_id'] || reader.info.id;
          const speaker = participantInfo.identity === room.localParticipant.identity ? 'You' : 'Agent';
          for await (const chunk of reader) {
            text += chunk;
            upsertTranscript(id, speaker, text, false);
          }
          const finalAttrs = reader.info.attributes || {};
          const final = finalAttrs['lk.transcription_final'] === 'true';
          upsertTranscript(id, speaker, text, final);
        });
        room.on(RoomEvent.TrackSubscribed, (track) => {
          if (track.kind === Track.Kind.Audio) {
            audioHost.appendChild(track.attach());
            addOutputMeter(track);
          }
        });
        room.on(RoomEvent.TrackUnsubscribed, (track) => {
          removeOutputMeter(track);
          track.detach().forEach((el) => el.remove());
        });
        room.on(RoomEvent.DataReceived, (payload, participant, kind, topic) => {
          if (topic !== toolEventTopic || payload.byteLength > 4096) return;
          try {
            const event = JSON.parse(textDecoder.decode(payload));
            if (isToolEvent(event)) upsertToolCall(event);
          } catch (error) {
            console.warn('Ignored malformed tool event', error);
          }
        });
        room.on(RoomEvent.ActiveSpeakersChanged, (speakers) => {
          const active = speakers[0];
          if (active) setStatus(active.identity === room.localParticipant.identity ? 'Listening…' : 'Agent speaking…');
        });
        room.on(RoomEvent.AudioPlaybackStatusChanged, () => {
          resumeButton.classList.toggle('hidden', room.canPlaybackAudio);
        });
        room.on(RoomEvent.Reconnecting, () => setStatus('Reconnecting…'));
        room.on(RoomEvent.Reconnected, () => setStatus('Connected'));
        room.on(RoomEvent.Disconnected, () => {
          setStatus('Disconnected'); showConnected(false); void stopLevelMeters();
        });
      }

      connectButton.addEventListener('click', async () => {
        connectButton.disabled = true;
        try {
          if (!navigator.mediaDevices?.getUserMedia) throw new Error('Microphone access requires HTTPS or localhost.');
          await ensureAudioContext();
          setStatus('Creating a private room…');
          const response = await fetch('/api/join', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              language: document.querySelector('#language').value || null,
              voice: document.querySelector('#voice').value || null,
              voice_instructions: document.querySelector('#voice-instructions').value || null,
            }),
          });
          if (!response.ok) throw new Error(await response.text());
          const credentials = await response.json();
          configureRoom();
          setStatus('Connecting to LiveKit…');
          await room.connect(credentials.server_url, credentials.participant_token);
          await room.startAudio();
          await room.localParticipant.setMicrophoneEnabled(true, { echoCancellation: true, noiseSuppression: true });
          const microphone = room.localParticipant.getTrackPublication(Track.Source.Microphone)?.track;
          setInputMeter(microphone);
          muted = false; muteButton.textContent = 'Mute microphone';
          showConnected(true); setStatus('Connected — start talking');
        } catch (error) {
          console.error(error); setStatus(error.message || 'Unable to connect');
          if (room) await room.disconnect();
          await stopLevelMeters();
        } finally { connectButton.disabled = false; }
      });
      muteButton.addEventListener('click', async () => {
        muted = !muted;
        await room.localParticipant.setMicrophoneEnabled(!muted);
        if (!muted) {
          const microphone = room.localParticipant.getTrackPublication(Track.Source.Microphone)?.track;
          setInputMeter(microphone);
        }
        muteButton.textContent = muted ? 'Unmute microphone' : 'Mute microphone';
        setStatus(muted ? 'Microphone muted' : 'Connected — start talking');
      });
      resumeButton.addEventListener('click', async () => { await room.startAudio(); });
      disconnectButton.addEventListener('click', async () => { if (room) await room.disconnect(); });
      window.addEventListener('beforeunload', () => {
        room?.disconnect();
        void stopLevelMeters();
      });
    </script>
  </body>
</html>
